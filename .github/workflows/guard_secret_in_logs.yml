name: Guard - segredo nos logs
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  segredo-nos-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: bash tests/security/no-secret-in-logs.sh
      - run: bash tests/security/no-message-in-logs.sh
      - run: bash tests/security/env-exemplo-gravacao-desligada.sh
