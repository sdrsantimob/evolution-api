name: Build Docker image

# DESLIGADO do gatilho automático em 14/11/2026 (item 10 do pacote do processo
# de produção, CI-A07 da auditoria 360° de 13/11/2026; escolha técnica da aba):
# este workflow herdado do projeto original publica a imagem em
# `evoapicloud/evolution-api` no Docker Hub — conta que não é nossa — e falhou
# em toda rodada (8 de 8 na main de 03/10 a 31/10). A nossa publicação não passa
# por aqui. Fica só o disparo manual, para quem um dia tiver conta própria e
# trocar o destino da imagem.
on:
  workflow_dispatch: {}

jobs:
  build_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: evoapicloud/evolution-api
          tags: type=semver,pattern=v{{version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}